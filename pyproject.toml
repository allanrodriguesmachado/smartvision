
[project]
name = "smartvision"
version = "0.1.0"
description = "Computer Vision and IoT platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "opencv-python-headless",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartvision"]
